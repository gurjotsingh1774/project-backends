; ==============================================================================
; Supervisord Master Process Configuration
; Streams all container process logs directly to /dev/stdout and /dev/stderr
; ==============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:shadow-room-backend]
directory=/app
command=/app/bin/shadow-room
environment=PORT="8081"
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=21

[program:secure-token-allocation-backend]
directory=/app
command=/app/bin/secure-token-allocation
environment=PORT="8082"
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=22

[program:data-pulse-backend]
directory=/app/data-pulse-backend
command=/app/data-pulse-backend/venv/bin/gunicorn --workers 2 --threads 4 --timeout 120 --bind 127.0.0.1:8083 app:app
environment=PORT="8083"
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=23


